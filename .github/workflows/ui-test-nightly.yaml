name: UI Nightly Tests

on:
  schedule:
    - cron: "0 5 * * 3,5"  # cron is UTC, this translates to 10 PM PST Tues and Thur.
  workflow_dispatch:

jobs:
  ios-ui-test-nightly:
    strategy:
      fail-fast: false
      matrix:
        test_suite:
          - ECALoginTests
          - BeaconLoginTests
          - AdvancedAuthBeaconLoginTests
          - LegacyLoginTests
          - MultiUserLoginTests
          - MigrationTests
    uses: ./.github/workflows/reusable-ui-test-workflow.yaml
    with:
      ios: "^26"
      xcode: "^26"
      test_suite: ${{ matrix.test_suite }}
    secrets: inherit
