name: UI Nightly Tests

on:
  schedule:
    - cron: "0 5 * * 2,4"  # cron is UTC, this translates to 10 PM PST Mon and Wed.
  workflow_dispatch:

jobs:
  ios-ui-test-nightly:
    uses: ./.github/workflows/reusable-ui-test-workflow.yaml
    with:
      ios: "^26"
      xcode: "^26"
      short_timeout: "2"
      long_timeout: "7"
    secrets: inherit
