on:
  workflow_call:
    inputs:
      is_pr:
        type: boolean
        default: false
      ios:
        default: "^26"
        required: false
        type: string
      xcode:
        default: "^26"
        required: false
        type: string
      macos:
        default: macos-latest
        required: false
        type: string
      pr_test:
        description: "Test identifier to run for PR (e.g. 'AuthFlowTesterUITests/LegacyLoginTests/testMethod'). Empty = run all tests."
        default: ""
        required: false
        type: string
      destination:
        description: "xcodebuild -destination (e.g. 'platform=iOS Simulator,name=iPhone 17,OS=26.0'). Empty = use default for iOS 26."
        default: ""
        required: false
        type: string

jobs:
  test-ui:
    runs-on: ${{ inputs.macos }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ inputs.is_pr }}
        with:
          fetch-depth: 100
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/checkout@v4
        if: ${{ !inputs.is_pr }}
        with:
          ref: ${{ github.head_ref }}
      - name: Install Dependencies
        env:
          UI_TEST_CONFIG: ${{ secrets.UI_TEST_CONFIG }}
        run: |
          ./install.sh
          echo "$UI_TEST_CONFIG" > ./shared/test/ui_test_config.json
      - name: Install iOS 17 runtime if needed
        if: ${{ inputs.ios == '^17' }}
        run: xcodes runtimes install "iOS 17.5"
      # Select Xcode only (mxcl action does not support -retry-tests-on-failure)
      - uses: mxcl/xcodebuild@v3
        with:
          xcode: ${{ inputs.xcode }}
          platform: iOS
          platform-version: ${{ inputs.ios }}
          action: none
      - name: Resolve simulator destination
        id: resolve_destination
        run: |
          if [ -n "${{ inputs.destination }}" ]; then
            echo "destination=${{ inputs.destination }}" >> "$GITHUB_OUTPUT"
          else
            SIM_UDID=$(xcrun simctl list devices available -j | python3 -c '
          import sys, json
          d = json.load(sys.stdin)
          for devices in d.get("devices", {}).values():
            for dev in devices:
              if dev.get("isAvailable", True) and "iPhone" in dev.get("name", ""):
                print(dev["udid"])
                sys.exit(0)
          sys.exit(1)
            ')
            if [ -z "$SIM_UDID" ]; then
              echo "::error::No available iPhone simulator found"
              exit 1
            fi
            echo "destination=platform=iOS Simulator,id=$SIM_UDID" >> "$GITHUB_OUTPUT"
          fi
      - name: Run UI tests
        id: xcodebuild
        run: |
          DESTINATION="${{ steps.resolve_destination.outputs.destination }}"
          ONLY_TESTING_ARGS=()
          if [ -n "${{ inputs.pr_test }}" ]; then
            ONLY_TESTING_ARGS+=(-only-testing "${{ inputs.pr_test }}")
          fi
          set -o pipefail
          xcodebuild test \
            -workspace SalesforceMobileSDK.xcworkspace \
            -scheme AuthFlowTester \
            -testPlan AuthFlowTester \
            "${ONLY_TESTING_ARGS[@]}" \
            -destination "$DESTINATION" \
            -resultBundlePath test \
            -enableCodeCoverage YES \
            | xcbeautify
        env:
          CODE_COVERAGE: YES
      - name: Verify xcresult bundle exists
        if: success() || failure()
        run: |
          if [ ! -d "test.xcresult" ]; then
            echo "::error::test.xcresult bundle was not created"
            exit 1
          fi
          echo "xcresult bundle exists and contains:"
          ls -lh test.xcresult/
      - name: Publish test results
        uses: kishikawakatsumi/xcresulttool@v1
        if: success() || failure()
        with:
          path: test.xcresult
          show-passed-tests: true
          title: AuthFlowTester UI Test Results
      - uses: codecov/codecov-action@v4
        if: success() || failure()
        with:
          flags: AuthFlowTesterUI
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload xcresult bundle
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-authflowtester-ui-ios${{ inputs.ios }}
          path: test.xcresult/
          retention-days: 30
