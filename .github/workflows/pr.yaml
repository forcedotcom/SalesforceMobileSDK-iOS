name: Pull Request

on:
  # pull_request_target is used so secrets are available to fork PRs.
  # Mitigated by per-job Member Check (see "Check Write Permission" / "Validate Write Permission").
  pull_request_target:  # zizmor: ignore[dangerous-triggers]
    branches: [dev, master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'CODEOWNERS'

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/DangerFiles/Gemfile
    steps:
      - name: Check Write Permission
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d  # v2.4.0
        id: check_permissions
        with:
          route: GET /repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug Permission Response
        env:
          PERMISSION_DATA: ${{ steps.check_permissions.outputs.data }}
        run: |
          echo "Permission raw response: $PERMISSION_DATA"
      - name: Validate Write Permission
        env:
          PERMISSION: ${{ fromJson(steps.check_permissions.outputs.data).permission }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "User $ACTOR has permission: $PERMISSION"
          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "admin" ]]; then
            echo "User $ACTOR does not have sufficient permission (write or admin) to proceed. Someone from the team needs to rerun this workflow AFTER it has been deemed safe."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          # We need a sufficient depth or Danger will occasionally run into issues checking which files were modified.
          fetch-depth: 100
          # This is dangerous without the member check
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Install Dependencies
        run: |
          npm install shelljs@0.8.5
          ./install.sh
      - name: Run Static Analysis
        # It would be nice to use xcbeaufity here but all the warnings and errors get annotated onto the PR, including
        # files not mofified in the PR which is annoying.
        run:
          xcodebuild analyze -workspace SalesforceMobileSDK.xcworkspace -scheme MobileSync -sdk 'iphonesimulator' \
          CLANG_ANALYZER_OUTPUT=plist-html CLANG_ANALYZER_OUTPUT_DIR=./clangReport RUN_CLANG_STATIC_ANALYZER=YES
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.310.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Report Static Analysis
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec danger --dangerfile=.github/DangerFiles/StaticAnalysis.rb --danger_id=StaticAnalysis

  test-orchestrator:
    runs-on: macos-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/.github/DangerFiles/Gemfile
    outputs:
      libs: ${{ steps.test-orchestrator.outputs.libs }}
      run_all_ui_tests: ${{ steps.test-orchestrator.outputs.run_all_ui_tests }}
    steps:
      - name: Check Write Permission
        uses: octokit/request-action@dad4362715b7fb2ddedf9772c8670824af564f0d  # v2.4.0
        id: check_permissions
        with:
          route: GET /repos/${{ github.repository }}/collaborators/${{ github.triggering_actor }}/permission
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Debug Permission Response
        env:
          PERMISSION_DATA: ${{ steps.check_permissions.outputs.data }}
        run: |
          echo "Permission raw response: $PERMISSION_DATA"
      - name: Validate Write Permission
        env:
          PERMISSION: ${{ fromJson(steps.check_permissions.outputs.data).permission }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          echo "User $ACTOR has permission: $PERMISSION"
          if [[ "$PERMISSION" != "write" && "$PERMISSION" != "admin" ]]; then
            echo "User $ACTOR does not have sufficient permission (write or admin) to proceed. Someone from the team needs to rerun this workflow AFTER it has been deemed safe."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          persist-credentials: false
          # We need a sufficient depth or Danger will occasionally run into issues checking which files were modified.
          fetch-depth: 100
          # This is dangerous without the member check
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: ruby/setup-ruby@afeafc3d1ab54a631816aba4c914a0081c12ff2f  # v1.310.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - name: Determine Tests to Run
        id: test-orchestrator
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bundle exec danger --dangerfile=.github/DangerFiles/TestOrchestrator.rb --danger_id="TestOrchestrator"

  ios-pr:
    needs: [test-orchestrator]
    strategy:
      fail-fast: false
      matrix:
        lib: ${{ fromJson(needs.test-orchestrator.outputs.libs) }}
        ios: [^26, ^18]
        include:
          - ios: ^26
            xcode: ^26
          - ios: ^18
            xcode: ^16
            macos: macos-15
    uses: ./.github/workflows/reusable-test-workflow.yaml
    permissions:
      contents: read
      pull-requests: write
    with:
      lib: ${{ matrix.lib }}
      ios: ${{ matrix.ios }}
      xcode: ${{ matrix.xcode }}
      macos: ${{ matrix.macos }}
      is_pr: true
    secrets:
      TEST_CREDENTIALS: ${{ secrets.TEST_CREDENTIALS }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  native-samples-pr:
    needs: [test-orchestrator]
    strategy:
      fail-fast: false
      matrix:
        app: [RestAPIExplorer, MobileSyncExplorer, AuthFlowTester]
        ios: [^26, ^18]
        include:
          - ios: ^26
            xcode: ^26
          - ios: ^18
            xcode: ^16
            macos: macos-15
    uses: ./.github/workflows/reusable-build-workflow.yaml
    permissions:
      contents: read
    with:
      app: ${{ matrix.app }}
      ios: ${{ matrix.ios }}
      xcode: ${{ matrix.xcode }}
      macos: ${{ matrix.macos }}
      is_pr: true

  ui-tests-pr:
    needs: [test-orchestrator]
    strategy:
      fail-fast: false
      matrix:
        ios: [^26, ^18]
        include:
          - ios: ^26
            xcode: ^26
          - ios: ^18
            xcode: ^16
            macos: macos-15
    uses: ./.github/workflows/reusable-ui-test-workflow.yaml
    permissions:
      contents: read
      pull-requests: write
    with:
      is_pr: true
      ios: ${{ matrix.ios }}
      xcode: ${{ matrix.xcode }}
      macos: ${{ matrix.macos }}
      run_all_ui_tests: ${{ needs.test-orchestrator.outputs.run_all_ui_tests == 'true' }}
      pr_test: "AuthFlowTesterUITests/LegacyLoginTests/testCAOpaque_DefaultScopes_WebServerFlow"
      short_timeout: "3"
      long_timeout: "15"
    secrets:
      UI_TEST_CONFIG: ${{ secrets.UI_TEST_CONFIG }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  ci-provenance:
    name: CI provenance
    if: always()
    needs: ["static-analysis", "test-orchestrator", "ios-pr", "native-samples-pr", "ui-tests-pr"]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Record GitHub execution context
        env:
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ github.repository_id }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXECUTED_SHA: ${{ github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 - <<'PYTHON'
          import json, os
          fields = {
              'repository': 'REPOSITORY', 'repository_id': 'REPOSITORY_ID',
              'run_id': 'RUN_ID', 'run_attempt': 'RUN_ATTEMPT', 'event': 'EVENT',
              'workflow_sha': 'WORKFLOW_SHA', 'sha': 'EXECUTED_SHA',
              'pr': 'PR_NUMBER', 'head_sha': 'HEAD_SHA',
              'head_repository_id': 'HEAD_REPOSITORY_ID',
              'base_sha': 'BASE_SHA', 'base_ref': 'BASE_REF',
          }
          value = {key: os.environ[env] for key, env in fields.items()}
          value['workflow_path'] = '.github/workflows/pr.yaml'
          with open('provenance.json', 'w') as output:
              json.dump(value, output, sort_keys=True)
          PYTHON
      - name: Upload provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-provenance-${{ github.run_id }}-${{ github.run_attempt }}
          path: provenance.json
          if-no-files-found: error
          retention-days: 30
          overwrite: false
